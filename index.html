<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Goachat — Colis et achats France ↔ Afrique de l'Ouest</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  .display-font { font-family: 'Fraunces', serif; }
  .body-font { font-family: 'Inter', sans-serif; }
  .tracking-font { font-family: 'JetBrains Mono', monospace; }
  .perforated {
    background-image: radial-gradient(circle, #F6F1E7 3px, transparent 3.5px);
    background-size: 14px 14px;
    background-position: -7px -7px;
  }
  @keyframes flyAlong {
    0% { left: 0%; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 96%; opacity: 0; }
  }
  .plane-anim { animation: flyAlong 3.5s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .plane-anim { animation: none; left: 45%; opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// ---- Icônes simples (dessinées à la main, pas de dépendance externe) ----
const Icon = ({ children, size = 18, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
    {children}
  </svg>
);
const Package = (p) => <Icon {...p}><rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M3 8l9-5 9 5"/><line x1="12" y1="8" x2="12" y2="21"/></Icon>;
const ShoppingBag = (p) => <Icon {...p}><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></Icon>;
const Plane = (p) => <Icon {...p}><path d="M2 12l19-8-6 8 6 8-19-8z"/></Icon>;
const MapPin = (p) => <Icon {...p}><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></Icon>;
const Phone = (p) => <Icon {...p}><path d="M5 4h4l1.5 4-2 1.5a12 12 0 0 0 5 5l1.5-2 4 1.5v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/></Icon>;
const MessageCircle = (p) => <Icon {...p}><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 20l1.3-4A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></Icon>;
const Check = (p) => <Icon {...p}><polyline points="20 6 9 17 4 12"/></Icon>;
const ArrowRight = (p) => <Icon {...p}><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></Icon>;
const User = (p) => <Icon {...p}><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></Icon>;
const LinkIcon = (p) => <Icon {...p}><path d="M9 15l6-6"/><path d="M11 5l1-1a3.5 3.5 0 0 1 5 5l-1 1"/><path d="M13 19l-1 1a3.5 3.5 0 0 1-5-5l1-1"/></Icon>;

// ---- Réglages ----
const RATE_PER_KG_EUR = { ci: 10, benin: 10 }; // € / kg de transport
const COMMISSION_RATE = 0.10; // 10% sur le montant de l'achat
const XOF_PEG = 655.957; // parité fixe EUR -> FCFA
const WHATSAPP_NUMBER = "33745655748"; // ton numéro WhatsApp Business

const DESTINATIONS = [
  { id: "ci", label: "Côte d'Ivoire", city: "Abidjan" },
  { id: "benin", label: "Bénin", city: "Cotonou" },
];

function eur(n) { return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fcfa(n) { return Math.round(n * XOF_PEG).toLocaleString("fr-FR"); }

function TrackingTicker() {
  const [n] = useState(() => Math.floor(100000 + Math.random() * 899999));
  const year = new Date().getFullYear();
  return <span className="tracking-font text-xs tracking-widest text-[#C9962C]">N° GC-{year}-{n}</span>;
}

function Field({ label, children }) {
  return (
    <div>
      <label className="text-xs uppercase tracking-wide text-[#5C6178] body-font">{label}</label>
      <div className="mt-2">{children}</div>
    </div>
  );
}
function TextInput({ icon: IconComp, ...props }) {
  return (
    <div className="flex items-center gap-2 rounded-lg border px-3 py-2.5" style={{ borderColor: "#5C6178" }}>
      {IconComp && <IconComp size={15} style={{ color: "#5C6178" }} />}
      <input {...props} className="body-font w-full focus:outline-none bg-transparent" />
    </div>
  );
}

function GoachatSite() {
  const [service, setService] = useState("colis");
  const [destination, setDestination] = useState("ci");
  const [prenom, setPrenom] = useState("");
  const [nom, setNom] = useState("");
  const [telephone, setTelephone] = useState("");
  const [weight, setWeight] = useState(3);
  const [colisDescription, setColisDescription] = useState("");
  const [destPrenom, setDestPrenom] = useState("");
  const [destNom, setDestNom] = useState("");
  const [destTelephone, setDestTelephone] = useState("");
  const [articleInfo, setArticleInfo] = useState("");
  const [montantAchat, setMontantAchat] = useState(50);
  const [devise, setDevise] = useState("EUR");
  const [paiement, setPaiement] = useState("mobile_money");
  const [submitted, setSubmitted] = useState(false);

  const dest = DESTINATIONS.find((d) => d.id === destination);
  const showColis = service !== "achat";
  const showAchat = service !== "colis";

  const montantAchatEUR = useMemo(() => {
    const v = Math.max(montantAchat, 0);
    return devise === "EUR" ? v : v / XOF_PEG;
  }, [montantAchat, devise]);

  const transportCost = useMemo(() => (!showColis ? 0 : Math.max(weight, 0) * RATE_PER_KG_EUR[destination]), [showColis, weight, destination]);
  const commission = useMemo(() => (!showAchat ? 0 : montantAchatEUR * COMMISSION_RATE), [showAchat, montantAchatEUR]);
  const achatTotal = useMemo(() => (!showAchat ? 0 : montantAchatEUR + commission), [showAchat, montantAchatEUR, commission]);
  const total = transportCost + achatTotal;

  const canSubmit = prenom.trim().length > 0 && nom.trim().length > 0 && telephone.trim().length > 5 &&
    (!showColis || (destPrenom.trim().length > 0 && destNom.trim().length > 0 && destTelephone.trim().length > 5)) &&
    (!showAchat || (articleInfo.trim().length > 0 && montantAchat > 0));

  const waMessage = useMemo(() => {
    const lines = [
      `Bonjour Goachat, je souhaite passer commande.`, ``,
      `Service : ${service === "colis" ? "Envoi de colis" : service === "achat" ? "Achat pour moi" : "Envoi de colis + Achat pour moi"}`,
      `Pays de destination : ${dest.label} (${dest.city})`, ``,
      `— Expéditeur —`, `Prénom : ${prenom}`, `Nom : ${nom}`, `Téléphone : ${telephone}`,
    ];
    if (showColis) lines.push(``, `— Colis —`, `Destinataire : ${destPrenom} ${destNom}`, `Téléphone destinataire : ${destTelephone}`, `Description : ${colisDescription || "—"}`, `Poids : ${weight} kg`);
    if (showAchat) lines.push(``, `— Achat pour moi —`, `Article (lien ou description) : ${articleInfo || "—"}`, `Montant total : ${montantAchat} ${devise}`);
    lines.push(``, `Paiement souhaité : ${paiement === "mobile_money" ? "Mobile Money" : "Carte bancaire"}`, `Total estimé : ${eur(total)} € (≈ ${fcfa(total)} FCFA)`);
    return encodeURIComponent(lines.join("\n"));
  }, [service, dest, prenom, nom, telephone, showColis, destPrenom, destNom, destTelephone, colisDescription, weight, showAchat, articleInfo, montantAchat, devise, paiement, total]);

  const handleSubmit = () => {
    if (!canSubmit) return;
    setSubmitted(true);
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${waMessage}`, "_blank");
  };

  return (
    <div className="min-h-screen w-full" style={{ background: "#F6F1E7", color: "#1C2541" }}>
      <header className="sticky top-0 z-20 backdrop-blur border-b" style={{ background: "rgba(246,241,231,0.9)", borderColor: "#1C2541" }}>
        <div className="max-w-5xl mx-auto px-5 py-4 flex items-center justify-between">
          <div className="display-font text-xl font-semibold tracking-tight">GOACHAT</div>
          <a href={`https://wa.me/${WHATSAPP_NUMBER}`} target="_blank" rel="noreferrer"
             className="flex items-center gap-2 text-sm font-medium px-3 py-1.5 rounded-full" style={{ background: "#1C2541", color: "#F6F1E7" }}>
            <MessageCircle size={16} /> WhatsApp
          </a>
        </div>
      </header>

      <section className="max-w-5xl mx-auto px-5 pt-12 pb-8">
        <div className="flex items-center gap-3 mb-4">
          <span className="uppercase text-xs tracking-[0.2em] text-[#5C6178] body-font">Bordereau d'expédition</span>
          <TrackingTicker />
        </div>
        <h1 className="display-font text-4xl sm:text-5xl font-semibold leading-tight max-w-2xl">
          Envoyez. Achetez. <span style={{ color: "#A63D40" }}>On gère la route.</span>
        </h1>
        <p className="body-font mt-4 text-[#5C6178] max-w-xl">
          Colis et achats entre la France et l'Afrique de l'Ouest, suivis comme un vrai fret — un tarif clair, un point de contact, une remise en main propre.
        </p>
        <div className="relative mt-10 h-16 border-t-2 border-dashed" style={{ borderColor: "#C9962C" }}>
          <div className="absolute -top-2 left-0 flex items-center gap-1 text-xs body-font font-medium"><MapPin size={14} style={{ color: "#1C2541" }} /> Paris</div>
          <div className="absolute -top-2 right-0 flex items-center gap-1 text-xs body-font font-medium">{dest.city} <MapPin size={14} style={{ color: "#1C2541" }} /></div>
          <Plane size={18} style={{ color: "#A63D40", position: "absolute", top: "-9px" }} className="plane-anim" />
        </div>
      </section>

      <section className="max-w-5xl mx-auto px-5 pb-16">
        <div className="rounded-2xl overflow-hidden shadow-sm border" style={{ borderColor: "#1C2541" }}>
          <div className="flex" style={{ background: "#1C2541" }}>
            {[{ id: "colis", label: "Envoi de colis", icon: Package }, { id: "achat", label: "Achat pour moi", icon: ShoppingBag }, { id: "both", label: "Les deux", icon: ArrowRight }].map(({ id, label, icon: IconComp }) => (
              <button key={id} onClick={() => setService(id)} className="flex-1 flex items-center justify-center gap-2 py-3.5 text-sm font-medium body-font transition"
                style={{ background: service === id ? "#F6F1E7" : "transparent", color: service === id ? "#1C2541" : "#F6F1E7" }}>
                <IconComp size={16} /> {label}
              </button>
            ))}
          </div>

          <div className="grid md:grid-cols-5">
            <div className="md:col-span-3 p-6 sm:p-8 space-y-6">
              <Field label="Pays de destination">
                <div className="flex gap-2">
                  {DESTINATIONS.map((d) => (
                    <button key={d.id} onClick={() => setDestination(d.id)} className="flex-1 rounded-lg border px-3 py-2.5 text-sm font-medium body-font transition"
                      style={{ borderColor: destination === d.id ? "#A63D40" : "#5C6178", background: destination === d.id ? "#FBEAEA" : "transparent", color: destination === d.id ? "#A63D40" : "#1C2541" }}>
                      {d.label}
                    </button>
                  ))}
                </div>
              </Field>

              {showColis && (
                <div className="space-y-4 rounded-xl p-4" style={{ background: "#FBF8F1" }}>
                  <div className="tracking-font text-[11px] text-[#5C6178]">DESTINATAIRE DU COLIS</div>
                  <div className="grid sm:grid-cols-2 gap-4">
                    <Field label="Prénom du destinataire"><TextInput icon={User} value={destPrenom} onChange={(e) => setDestPrenom(e.target.value)} placeholder="Prénom" /></Field>
                    <Field label="Nom du destinataire"><TextInput icon={User} value={destNom} onChange={(e) => setDestNom(e.target.value)} placeholder="Nom" /></Field>
                  </div>
                  <Field label="Téléphone du destinataire"><TextInput icon={Phone} value={destTelephone} onChange={(e) => setDestTelephone(e.target.value)} placeholder="+225 ..." /></Field>
                  <Field label="Description du colis"><TextInput value={colisDescription} onChange={(e) => setColisDescription(e.target.value)} placeholder="Ex : vêtements, chaussures, documents..." /></Field>
                  <Field label="Poids estimé (kg)">
                    <input type="number" min="0.5" step="0.5" value={weight} onChange={(e) => setWeight(parseFloat(e.target.value) || 0)}
                      className="w-full rounded-lg border px-3 py-2.5 body-font focus:outline-none focus:ring-2" style={{ borderColor: "#5C6178" }} />
                  </Field>
                </div>
              )}

              {showAchat && (
                <div className="space-y-4 rounded-xl p-4" style={{ background: "#FBF8F1" }}>
                  <div className="tracking-font text-[11px] text-[#5C6178]">ARTICLE À ACHETER</div>
                  <Field label="Lien de l'article ou description"><TextInput icon={LinkIcon} value={articleInfo} onChange={(e) => setArticleInfo(e.target.value)} placeholder="https://... ou description de l'article" /></Field>
                  <div className="grid sm:grid-cols-2 gap-4">
                    <Field label="Montant total">
                      <input type="number" min="1" step="1" value={montantAchat} onChange={(e) => setMontantAchat(parseFloat(e.target.value) || 0)}
                        className="w-full rounded-lg border px-3 py-2.5 body-font focus:outline-none focus:ring-2" style={{ borderColor: "#5C6178" }} />
                    </Field>
                    <Field label="Devise">
                      <div className="flex gap-2">
                        {["EUR", "FCFA"].map((d) => (
                          <button key={d} onClick={() => setDevise(d)} className="flex-1 rounded-lg border px-3 py-2.5 text-sm font-medium body-font transition"
                            style={{ borderColor: devise === d ? "#1C2541" : "#5C6178", background: devise === d ? "#1C2541" : "transparent", color: devise === d ? "#F6F1E7" : "#1C2541" }}>
                            {d}
                          </button>
                        ))}
                      </div>
                    </Field>
                  </div>
                </div>
              )}

              <div className="space-y-4">
                <div className="tracking-font text-[11px] text-[#5C6178]">TES COORDONNÉES</div>
                <div className="grid sm:grid-cols-2 gap-4">
                  <Field label="Prénom"><TextInput icon={User} value={prenom} onChange={(e) => setPrenom(e.target.value)} placeholder="Ton prénom" /></Field>
                  <Field label="Nom"><TextInput icon={User} value={nom} onChange={(e) => setNom(e.target.value)} placeholder="Ton nom" /></Field>
                </div>
                <Field label="Téléphone / WhatsApp"><TextInput icon={Phone} value={telephone} onChange={(e) => setTelephone(e.target.value)} placeholder="06 00 00 00 00" /></Field>
              </div>

              <Field label="Paiement">
                <div className="flex gap-2">
                  {[{ id: "mobile_money", label: "Mobile Money" }, { id: "carte", label: "Carte bancaire" }].map((p) => (
                    <button key={p.id} onClick={() => setPaiement(p.id)} className="flex-1 rounded-lg border px-3 py-2.5 text-sm font-medium body-font transition"
                      style={{ borderColor: paiement === p.id ? "#1C2541" : "#5C6178", background: paiement === p.id ? "#1C2541" : "transparent", color: paiement === p.id ? "#F6F1E7" : "#1C2541" }}>
                      {p.label}
                    </button>
                  ))}
                </div>
              </Field>
            </div>

            <div className="md:col-span-2 p-6 sm:p-8 perforated border-t md:border-t-0 md:border-l" style={{ borderColor: "#1C2541" }}>
              <div className="tracking-font text-[11px] text-[#5C6178] mb-4">ESTIMATION — {dest.label.toUpperCase()}</div>
              <div className="space-y-2 body-font text-sm">
                {showColis && (
                  <div className="flex justify-between">
                    <span className="text-[#5C6178]">Transport ({weight} kg × {eur(RATE_PER_KG_EUR[destination])} €)</span>
                    <span className="font-medium">{eur(transportCost)} €</span>
                  </div>
                )}
                {showAchat && (
                  <>
                    <div className="flex justify-between">
                      <span className="text-[#5C6178]">Montant achat</span>
                      <span className="font-medium">{montantAchat} {devise}{devise === "FCFA" && <span className="text-[#5C6178]"> (≈ {eur(montantAchatEUR)} €)</span>}</span>
                    </div>
                    <div className="flex justify-between"><span className="text-[#5C6178]">Commission (10%)</span><span className="font-medium">{eur(commission)} €</span></div>
                  </>
                )}
              </div>
              <div className="mt-4 pt-4 border-t" style={{ borderColor: "#1C2541" }}>
                <div className="flex justify-between items-baseline">
                  <span className="body-font text-sm text-[#5C6178]">Total estimé</span>
                  <span className="display-font text-2xl font-semibold">{eur(total)} €</span>
                </div>
                <div className="text-right text-xs text-[#5C6178] tracking-font mt-1">≈ {fcfa(total)} FCFA</div>
              </div>
              <button onClick={handleSubmit} disabled={!canSubmit} className="mt-6 w-full flex items-center justify-center gap-2 rounded-lg py-3 text-sm font-semibold body-font transition"
                style={{ background: canSubmit ? "#A63D40" : "#C9BFAE", color: "#F6F1E7", cursor: canSubmit ? "pointer" : "not-allowed" }}>
                <MessageCircle size={16} /> Envoyer la commande via WhatsApp
              </button>
              {!canSubmit && <p className="text-xs text-[#5C6178] mt-2 body-font">Complète tes coordonnées{showColis ? ", celles du destinataire" : ""}{showAchat ? " et l'article à acheter" : ""} pour continuer.</p>}
              {submitted && <p className="text-xs mt-2 body-font flex items-center gap-1" style={{ color: "#4C7A5E" }}><Check size={14} /> Ouverture de WhatsApp avec ta commande pré-remplie.</p>}
            </div>
          </div>
        </div>
        <p className="text-xs text-[#5C6178] body-font mt-3">Tarifs à titre indicatif.</p>
      </section>

      <section className="max-w-5xl mx-auto px-5 pb-20">
        <h2 className="display-font text-2xl font-semibold mb-6">Comment ça marche</h2>
        <div className="grid sm:grid-cols-3 gap-6">
          {[{ n: "01", title: "Tu remplis le bordereau", desc: "Tes coordonnées, celles du destinataire ou l'article à acheter — l'estimation s'affiche en direct." },
            { n: "02", title: "On confirme sur WhatsApp", desc: "Tu reçois le prix final et les modalités de paiement." },
            { n: "03", title: "Réception à destination", desc: "Suivi jusqu'à la remise à Abidjan ou Cotonou." }].map((s) => (
            <div key={s.n} className="border-t pt-4" style={{ borderColor: "#1C2541" }}>
              <div className="tracking-font text-xs text-[#C9962C] mb-2">{s.n}</div>
              <div className="body-font font-semibold mb-1">{s.title}</div>
              <div className="body-font text-sm text-[#5C6178]">{s.desc}</div>
            </div>
          ))}
        </div>
      </section>

      <footer className="border-t py-8" style={{ borderColor: "#1C2541" }}>
        <div className="max-w-5xl mx-auto px-5 flex flex-col sm:flex-row justify-between gap-4 body-font text-sm text-[#5C6178]">
          <div className="display-font font-semibold text-[#1C2541]">GOACHAT</div>
          <div>Morsang-sur-Orge, France · Abidjan · Cotonou</div>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GoachatSite />);
</script>
</body>
</html>
