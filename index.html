  entrepot: { label: "Arrivé en entrepôt (France)", icon: Archive, hint: "Le produit est arrivé, préparation de l'envoi." },
  collecte: { label: "Colis récupéré", icon: Archive, hint: "Votre colis a été récupéré et va être préparé pour l'envoi." },
  expediee: { label: "Colis expédié", icon: Truck, hint: "Votre colis est en route." },

  livree: { label: "Livré", icon: PackageCheck, hint: "Livré. Merci d'avoir utilisé Goachat !" },
};

const STAGE_KEYS_ACHAT = ["nouvelle", "devis", "payee", "commandee", "entrepot", "expediee", "douane", "livree"];
const STAGE_KEYS_ENVOI = ["nouvelle", "devis", "payee", "collecte", "expediee", "douane", "livree"];
const FILTER_KEYS = ["nouvelle", "devis", "payee", "commandee", "entrepot", "collecte", "expediee", "douane", "livree"];

function stagesForType(type) {
  const keys = type === "achat" ? STAGE_KEYS_ACHAT : STAGE_KEYS_ENVOI;
  return keys.map((k) => ({ key: k, ...STAGE_DEFS[k] }));
}

function generateRef() {
  const now = new Date();
  const y = String(now.getFullYear()).slice(2);
  const m = String(now.getMonth() + 1).padStart(2, "0");
  const d = String(now.getDate()).padStart(2, "0");
  const rand = Math.random().toString(36).slice(2, 6).toUpperCase();
  return `GC-${y}${m}${d}-${rand}`;
}

function formatDateTime(iso) {
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    return (
      d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " à " +
      d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    );
  } catch {
    return iso;
  }
}

function formatAmount(amount, devise) {
  const n = Number(amount) || 0;
  if (devise === "FCFA") return `${Math.round(n).toLocaleString("fr-FR")} FCFA`;
  return `${n.toLocaleString("fr-FR", { maximumFractionDigits: 2 })} €`;
}

function conversionHint(amount, devise) {
  const n = Number(amount);
  if (!n || n <= 0) return null;
  const other = devise === "EUR" ? n * XOF_PER_EUR : n / XOF_PER_EUR;
  const otherDevise = devise === "EUR" ? "FCFA" : "EUR";
  return `≈ ${formatAmount(other, otherDevise)}`;
}

function summaryLine(r) {
  if (r.type === "achat") return `Destination : ${r.destination}`;
  return `Trajet : ${r.villeDepart || "?"} → ${r.villeArrivee || "?"}`;
}

// --- Mapping JS (camelCase) <-> colonnes Postgres (snake_case) -------------
function toDbRow(obj) {
  const map = {
    id: "id",
    type: "type",
    nom: "nom",
    contact: "contact",
    devise: "devise",
    montant: "montant",
    lien: "lien",
    destination: "destination",
    description: "description",
    villeDepart: "ville_depart",
    villeArrivee: "ville_arrivee",
    poids: "poids",
    status: "status",
    createdAt: "created_at",
    updatedAt: "updated_at",
    note: "note",
    history: "history",
  };
  const row = {};
  Object.keys(obj).forEach((k) => {
    if (map[k] !== undefined) row[map[k]] = obj[k];
  });
  return row;
}

function fromDbRow(row) {
  return {
    id: row.id,
    type: row.type,
    nom: row.nom,
    contact: row.contact,
    devise: row.devise,
    montant: row.montant,
    lien: row.lien,
    destination: row.destination,
    description: row.description,
    villeDepart: row.ville_depart,
    villeArrivee: row.ville_arrivee,
    poids: row.poids,
    status: row.status,
    createdAt: row.created_at,
    updatedAt: row.updated_at,
    note: row.note,
    history: row.history || [],
  };
}

async function supaFetch(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      Prefer: options.prefer || "return=representation",
      ...(options.headers || {}),
    },
  });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`Supabase ${res.status}: ${text}`);
  }
  if (res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function loadAllRequests() {
  try {
    const rows = await supaFetch(`${TABLE}?select=*&order=created_at.desc`);
    return (rows || []).map(fromDbRow);
  } catch (e) {
    console.error("loadAllRequests failed", e);
    return [];
  }
}

async function insertRequest(entry) {
  const rows = await supaFetch(TABLE, {
    method: "POST",
    body: JSON.stringify(toDbRow(entry)),
  });
  return rows && rows[0] ? fromDbRow(rows[0]) : entry;
}

async function patchRequest(id, patch) {
  const rows = await supaFetch(`${TABLE}?id=eq.${encodeURIComponent(id)}`, {
    method: "PATCH",
    body: JSON.stringify(toDbRow(patch)),
  });
  return rows && rows[0] ? fromDbRow(rows[0]) : null;
}

async function deleteAllRequests() {
  await supaFetch(`${TABLE}?id=not.is.null`, {
    method: "DELETE",
    headers: { Prefer: "return=minimal" },
  });
}

export default function GoachatApp() {
  const [view, setView] = useState("form");
  const [requests, setRequests] = useState([]);
  const [ready, setReady] = useState(false);
  const [syncError, setSyncError] = useState("");

  const refresh = useCallback(async () => {
    const list = await loadAllRequests();
    setRequests(list);
    setReady(true);
  }, []);

  useEffect(() => {
    refresh();
  }, [refresh]);

  useEffect(() => {
    try {
      if (window.location.hash === "#admin") setView("admin");
    } catch (e) {}
  }, []);

  const addRequest = useCallback(async (data) => {
    const id = generateRef();
    const now = new Date().toISOString();
    const entry = {
      id,
      ...data,
      status: "nouvelle",
      createdAt: now,
      updatedAt: now,
      note: "",
      history: [{ status: "nouvelle", at: now }],
    };
    try {
      const inserted = await insertRequest(entry);
      setRequests((prev) => [inserted, ...prev]);
      setSyncError("");
    } catch (e) {
      console.error(e);
      setSyncError("L'envoi a échoué, réessaie dans un instant.");
    }
    return id;
  }, []);

  const updateRequest = useCallback(
    async (id, patch) => {
      const current = requests.find((r) => r.id === id);
      const now = new Date().toISOString();
      const patchToSend = { ...patch, updatedAt: now };
      if (patch.status && current && patch.status !== current.status) {
        patchToSend.history = [...(current.history || []), { status: patch.status, at: now }];
      }
      try {
        const updated = await patchRequest(id, patchToSend);
        setRequests((prev) => prev.map((r) => (r.id === id ? updated || { ...r, ...patchToSend } : r)));
        setSyncError("");
      } catch (e) {
        console.error(e);
        setSyncError("La sauvegarde a échoué, réessaie.");
      }
    },
    [requests]
  );

  const resetAll = useCallback(async () => {
    try {
      await deleteAllRequests();
      setRequests([]);
      setSyncError("");
    } catch (e) {
      console.error(e);
      setSyncError("La suppression a échoué, réessaie.");
    }
  }, []);

  return (
    <div className="min-h-screen" style={{ backgroundColor: C.paper }}>
      <div className="max-w-md mx-auto px-4 py-6">
        <TopNav view={view} setView={setView} />
        {view === "form" && <RequestForm onSubmit={addRequest} />}
        {view === "track" && <TrackingView requests={requests} ready={ready} />}
        {view === "admin" && (
          <AdminView requests={requests} ready={ready} onUpdate={updateRequest} onRefresh={refresh} onResetAll={resetAll} />
        )}
        <p className="text-center text-xs mt-8" style={{ color: C.inkSoft }}>
          Goachat — vos demandes sont sauvegardées en temps réel.
        </p>
        {syncError && (
          <div
            className="mt-3 p-3 rounded-lg text-xs text-center flex items-center justify-center gap-1.5"
            style={{ backgroundColor: C.amberTint, color: C.danger }}
          >
            <AlertCircle size={14} /> {syncError}
          </div>
        )}
      </div>
    </div>
  );
}

}

      {hint && (

}

function RequestForm({ onSubmit }) {
  const emptyForm = {
    type: null,
    nom: "",
    contact: "",
    devise: "EUR",
    montant: "",
    lien: "",
    destination: DESTINATIONS[0],
    description: "",
    villeDepart: "",
    villeArrivee: "",
    poids: "",
  };
  const [form, setForm] = useState(emptyForm);
  const [submitting, setSubmitting] = useState(false);
  const [refCode, setRefCode] = useState(null);
  const [copied, setCopied] = useState(false);
  const [error, setError] = useState("");

  const set = (key) => (e) => setForm((f) => ({ ...f, [key]: e.target.value }));

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    if (!form.type) {
      setError("Choisis un type de service pour commencer.");
      return;
    }
    if (!form.nom.trim() || !form.contact.trim()) {
      setError("Merci de remplir les champs obligatoires.");
      return;
    }
    if (form.type === "achat") {
      if (!form.description.trim() || !form.montant) {
        setError("Merci de remplir les champs obligatoires.");
        return;
      }
      if (Number(form.montant) <= 0) {
        setError("Le budget doit être supérieur à 0.");
        return;
      }
    } else {
      if (!form.description.trim() || !form.villeDepart.trim() || !form.villeArrivee.trim() || !form.poids) {
        setError("Merci de remplir les champs obligatoires.");
        return;
      }
      if (Number(form.poids) <= 0) {
        setError("Le poids doit être supérieur à 0.");
        return;
      }
    }
    setSubmitting(true);
    const id = await onSubmit({
      type: form.type,
      nom: form.nom.trim(),
      contact: form.contact.trim(),
      devise: form.devise,
      montant: form.montant ? Number(form.montant) : 0,
      lien: form.lien.trim(),
      destination: form.destination,
      description: form.description.trim(),
      villeDepart: form.villeDepart.trim(),
      villeArrivee: form.villeArrivee.trim(),
      poids: form.poids ? Number(form.poids) : 0,
    });
    setSubmitting(false);
    setRefCode(id);
  };

  const copyCode = async () => {
    try {
      await navigator.clipboard.writeText(refCode);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {}
  };

  if (refCode) {
    return (
      <div className="text-center py-8">
        <p className="gc-mono text-xs mb-2" style={{ color: C.rust, letterSpacing: "0.05em" }}>
          GOACHAT · CONFIRMATION
        </p>
        <h2 className="gc-display text-2xl mb-3" style={{ color: C.ink }}>
          Demande envoyée
        </h2>
        <p className="text-sm mb-4" style={{ color: C.inkSoft }}>
          Ta référence de suivi :
        </p>
        <div
          className="inline-flex items-center gap-2 px-4 py-3 rounded-lg mb-6"
          style={{ backgroundColor: C.card, border: `1px solid ${C.line}` }}
        >
          <span className="gc-mono text-base font-semibold" style={{ color: C.ink }}>
            {refCode}
          </span>
          <button type="button" onClick={copyCode} aria-label="Copier la référence">
            {copied ? <Check size={16} color={C.signal} /> : <Copy size={16} color={C.inkSoft} />}
          </button>
        </div>
        <p className="text-sm mb-8 px-2" style={{ color: C.inkSoft }}>
          On te contacte sous 24-48h avec un devis, sur WhatsApp ou par email. Garde cette référence : elle te
          permettra de suivre ton colis.
        </p>
        <button
          type="button"
          onClick={() => {
            setRefCode(null);
            setForm(emptyForm);
          }}
          className="gc-body text-sm font-semibold px-5 py-2.5 rounded-lg"
          style={{ backgroundColor: C.ink, color: C.paper }}
        >
          Faire une autre demande
        </button>
      </div>
    );
  }

  return (
    <form onSubmit={handleSubmit}>
      <p className="gc-mono text-xs mb-2" style={{ color: C.rust, letterSpacing: "0.05em" }}>
        GOACHAT · NOUVELLE DEMANDE
      </p>
      <h1 className="gc-display text-2xl mb-2" style={{ color: C.ink }}>
        Dites-nous ce qu'il vous faut.
      </h1>
      <p className="text-sm mb-5" style={{ color: C.inkSoft }}>
        Achat en Europe, envoi vers la France ou vers le Bénin — choisis ton service.
      </p>

      <div className="space-y-2.5 mb-6">
        {SERVICE_TYPES.map((t) => {
          const Icon = t.icon;

          return (
            <button
              key={t.key}
              type="button"
              onClick={() => setForm((f) => ({ ...f, type: t.key }))}
              className="w-full text-left p-4 rounded-xl border-2 flex items-start gap-3 transition-colors"
              style={{
                borderColor: selected ? C.amber : C.line,
                backgroundColor: selected ? C.amberTint : C.card,
              }}
            >
              <Icon size={20} color={selected ? C.rust : C.inkSoft} style={{ marginTop: 2, flexShrink: 0 }} />
              <span>
                <span className="block text-sm font-semibold" style={{ color: C.ink }}>
                  {t.label}

                <span className="block text-xs mt-0.5" style={{ color: C.inkSoft }}>
                  {t.blurb}
                </span>
              </span>
            </button>

      {form.type && (
        <div className="space-y-4">

              placeholder="Ton nom"
            />
          </Field>

          <Field label="Contact (WhatsApp ou email)" required>
            <input
              value={form.contact}
              onChange={set("contact")}
              type="text"
              required
              className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
              style={{ borderColor: C.line, backgroundColor: C.card }}
              placeholder="+229... ou email@exemple.com"

          {form.type === "achat" ? (
            <>
              <Field label="Destination" required>
                <div className="flex flex-wrap gap-2">

              <Field label="Description du produit" required hint="Modèle, taille, couleur... tout ce qui aide à identifier le bon article.">

                  placeholder="Ex : sac à main Zara noir, taille unique"

              <Field label="Lien du produit (optionnel)">
                <input
                  value={form.lien}
                  onChange={set("lien")}
                  type="url"
                  className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
                  style={{ borderColor: C.line, backgroundColor: C.card }}
                  placeholder="https://..."
                />
              </Field>
            </>
          ) : (
            <>
              <Field label="Description du colis" required>
                <textarea
                  value={form.description}
                  onChange={set("description")}
                  required
                  rows={3}
                  className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm resize-none"
                  style={{ borderColor: C.line, backgroundColor: C.card }}
                  placeholder="Ce que contient le colis"
                />
              </Field>

              <Field label="Ville de départ" required>
                <input
                  value={form.villeDepart}
                  onChange={set("villeDepart")}
                  type="text"
                  required
                  className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
                  style={{ borderColor: C.line, backgroundColor: C.card }}
                  placeholder={form.type === "envoi_bj_fr" ? "Cotonou" : "Paris"}
                />
              </Field>

              <Field label="Ville d'arrivée" required>
                <input
                  value={form.villeArrivee}
                  onChange={set("villeArrivee")}
                  type="text"
                  required
                  className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
                  style={{ borderColor: C.line, backgroundColor: C.card }}
                  placeholder={form.type === "envoi_bj_fr" ? "Paris" : "Cotonou"}
                />
              </Field>

              <Field label="Poids estimé (kg)" required>
                <input
                  value={form.poids}
                  onChange={set("poids")}
                  type="number"
                  min="0"
                  step="0.1"
                  required
                  className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
                  style={{ borderColor: C.line, backgroundColor: C.card }}
                  placeholder="5"
                />
              </Field>
            </>
          )}

          <Field label="Devise" required>
            <div className="flex gap-2">
              {DEVISES.map((d) => {
                const sel = form.devise === d.key;
                return (
                  <button
                    key={d.key}
                    type="button"
                    onClick={() => setForm((f) => ({ ...f, devise: d.key }))}
                    className="flex-1 gc-body text-sm font-semibold py-2.5 rounded-lg border-2"
                    style={{
                      borderColor: sel ? C.amber : C.line,
                      backgroundColor: sel ? C.amberTint : C.card,
                      color: C.ink,
                    }}
                  >
                    {d.label}
                  </button>
                );
              })}
            </div>
          </Field>

          <Field
            label={form.type === "achat" ? "Budget estimé" : "Valeur déclarée (optionnel)"}
            required={form.type === "achat"}
            hint={
              form.type === "achat"
                ? "Prix du produit en France, hors frais de service et d'expédition."
                : "Utile pour la douane, pas obligatoire."
            }
          >
            <input
              value={form.montant}
              onChange={set("montant")}
              type="number"
              min="0"
              step="0.01"
              required={form.type === "achat"}
              className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
              style={{ borderColor: C.line, backgroundColor: C.card }}
              placeholder={form.devise === "EUR" ? "45" : "30000"}
            />
            {conversionHint(form.montant, form.devise) && (
              <span className="text-xs block mt-1.5" style={{ color: C.inkSoft }}>
                {conversionHint(form.montant, form.devise)}
              </span>
            )}
          </Field>

          {error && (
            <p className="text-sm flex items-center gap-1.5" style={{ color: C.danger }}>
              <AlertCircle size={14} /> {error}
            </p>
          )}

          <button
            type="submit"
            disabled={submitting}
            className="gc-body w-full flex items-center justify-center gap-2 font-semibold text-sm py-3.5 rounded-lg"
            style={{ backgroundColor: C.amber, color: C.ink, opacity: submitting ? 0.7 : 1 }}
          >
            {submitting ? <Loader2 size={16} className="animate-spin" /> : <Send size={16} />}
            {submitting ? "Envoi..." : "Envoyer la demande"}
          </button>
        </div>
      )}

      {!form.type && error && (
        <p className="text-sm flex items-center gap-1.5 mt-3" style={{ color: C.danger }}>
          <AlertCircle size={14} /> {error}
        </p>
      )}
    </form>
  );
}

function StatusTimeline({ stages, currentIndex }) {
  return (
    <div>
      {stages.map((stage, i) => {
        const done = i < currentIndex;
        const active = i === currentIndex;
        const Icon = stage.icon;
        const isLast = i === stages.length - 1;
        return (
          <div key={stage.key} className="flex gap-4 relative" style={{ paddingBottom: isLast ? 0 : 28 }}>
            {!isLast && (
              <div
                className="absolute w-0.5"
                style={{
                  left: 19,
                  top: 40,
                  bottom: 0,
                  backgroundColor: done ? C.signal : "transparent",
                  backgroundImage: done
                    ? "none"
                    : `repeating-linear-gradient(to bottom, ${C.line} 0, ${C.line} 4px, transparent 4px, transparent 9px)`,
                }}
              />
            )}
            <div
              className={`flex-shrink-0 w-10 h-10 rounded-full flex items-center justify-center border-2 z-10 ${
                active ? "gc-pulse" : ""
              }`}
              style={{
                backgroundColor: done ? C.signal : active ? C.amber : C.paper,
                borderColor: done ? C.signal : active ? C.amber : C.line,
              }}
            >
              <Icon size={17} color={done || active ? "#fff" : C.inkSoft} />
            </div>
            <div className="pt-2">
              <p className="text-sm font-semibold" style={{ color: done || active ? C.ink : C.inkSoft }}>
                {stage.label}
              </p>
              {active && stage.hint && (
                <p className="text-xs mt-0.5" style={{ color: C.inkSoft }}>
                  {stage.hint}
                </p>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function TrackingView({ requests, ready }) {
  const [query, setQuery] = useState("");
  const [searched, setSearched] = useState(false);
  const [result, setResult] = useState(null);

  const handleSearch = (e) => {
    e.preventDefault();
    const found = requests.find((r) => r.id.toLowerCase() === query.trim().toLowerCase());
    setResult(found || null);
    setSearched(true);
  };

  const stages = result ? stagesForType(result.type) : [];
  const currentIndex = result ? stages.findIndex((s) => s.key === result.status) : -1;

  return (
    <div>
      <p className="gc-mono text-xs mb-2" style={{ color: C.rust, letterSpacing: "0.05em" }}>
        GOACHAT · SUIVI
      </p>
      <h1 className="gc-display text-2xl mb-2" style={{ color: C.ink }}>
        Où en est ton colis ?
      </h1>
      <p className="text-sm mb-5" style={{ color: C.inkSoft }}>
        Entre ta référence pour voir l'avancement.
      </p>

      <form onSubmit={handleSearch} className="flex gap-2 mb-8">
        <input
          value={query}
          onChange={(e) => setQuery(e.target.value)}
          type="text"
          placeholder="GC-260714-A93F"
          className="gc-mono flex-1 px-3.5 py-3 rounded-lg border text-sm uppercase"
          style={{ borderColor: C.line, backgroundColor: C.card }}
        />
        <button
          type="submit"
          disabled={!ready}
          className="px-4 py-3 rounded-lg flex items-center justify-center"
          style={{ backgroundColor: C.ink, opacity: ready ? 1 : 0.6 }}
        >
          {ready ? <Search size={18} color={C.paper} /> : <Loader2 size={18} color={C.paper} className="animate-spin" />}
        </button>
      </form>

      {searched && !result && (
        <div className="rounded-xl p-5 flex items-start gap-3" style={{ backgroundColor: C.card, border: `1px solid ${C.line}` }}>
          <AlertCircle size={18} style={{ color: C.rust, flexShrink: 0, marginTop: 2 }} />
          <div>
            <p className="text-sm font-semibold mb-1" style={{ color: C.ink }}>
              Introuvable
            </p>
            <p className="text-sm" style={{ color: C.inkSoft }}>
              Vérifie ta référence (format GC-XXXXXX-XXXX). Si le problème persiste, contacte-nous directement.
            </p>
          </div>
        </div>
      )}

      {result && (
        <div>
          <div className="rounded-xl p-4 mb-6" style={{ backgroundColor: C.card, border: `1px solid ${C.line}` }}>
            <p className="gc-mono text-xs mb-1" style={{ color: C.inkSoft }}>
              {result.id}
            </p>
            <p className="text-sm font-semibold mb-1" style={{ color: C.ink }}>
              {result.description}
            </p>
            <p className="text-xs" style={{ color: C.inkSoft }}>
              {summaryLine(result)} · Dernière mise à jour : {formatDateTime(result.updatedAt)}
            </p>
          </div>
          <StatusTimeline stages={stages} currentIndex={currentIndex} />
        </div>
      )}
    </div>
  );
}

function InfoItem({ label, value }) {
  return (
    <div>
      <p className="font-semibold" style={{ color: C.inkSoft }}>
        {label}
      </p>
      <p style={{ color: C.ink }}>{value || "—"}</p>
    </div>
  );
}

function StatusBadge({ request }) {
  const stage = STAGE_DEFS[request.status];
  if (!stage) return null;
  const Icon = stage.icon;
  return (
    <span
      className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold"
      style={{ backgroundColor: C.paperAlt, color: C.ink }}
    >
      <Icon size={10} /> {stage.label}
    </span>
  );
}

function TypeBadge({ type }) {
  const t = SERVICE_TYPES.find((s) => s.key === type);
  if (!t) return null;
  return (
    <span
      className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold"
      style={{ backgroundColor: C.ink, color: C.paper }}
    >
      {t.short}
    </span>
  );
}

function AdminRequestRow({ request, expanded, onToggle, onUpdate }) {
  const [note, setNote] = useState(request.note || "");
  const [savedFlash, setSavedFlash] = useState(false);
  const stages = stagesForType(request.type);

  const handleStatusChange = async (e) => {
    await onUpdate(request.id, { status: e.target.value });
    setSavedFlash(true);
    setTimeout(() => setSavedFlash(false), 1500);
  };

  const handleNoteBlur = async () => {
    if (note !== (request.note || "")) {
      await onUpdate(request.id, { note });
    }
  };

  return (
    <div className="rounded-xl overflow-hidden" style={{ border: `1px solid ${C.line}`, backgroundColor: C.card }}>
      <button onClick={onToggle} className="w-full flex items-center justify-between gap-3 p-3.5 text-left">
        <div className="min-w-0 flex-1">
          <div className="flex items-center gap-1.5 mb-0.5 flex-wrap">
            <span className="gc-mono text-xs" style={{ color: C.inkSoft }}>
              {request.id}
            </span>
            <TypeBadge type={request.type} />
            <StatusBadge request={request} />
          </div>
          <p className="text-sm font-semibold truncate" style={{ color: C.ink }}>
            {request.nom}
          </p>
          <p className="text-xs truncate" style={{ color: C.inkSoft }}>
            {request.description}
          </p>
        </div>
        <ChevronDown
          size={18}
          style={{ color: C.inkSoft, transform: expanded ? "rotate(180deg)" : "none", transition: "transform 0.15s", flexShrink: 0 }}
        />
      </button>

      {expanded && (
        <div className="px-3.5 pb-3.5 pt-1 space-y-3" style={{ borderTop: `1px solid ${C.line}` }}>
          <div className="grid grid-cols-2 gap-3 pt-3 text-xs">
            <InfoItem label="Contact" value={request.contact} />
            {request.type === "achat" ? (
              <InfoItem label="Destination" value={request.destination} />
            ) : (
              <>
                <InfoItem label="Trajet" value={`${request.villeDepart} → ${request.villeArrivee}`} />
                <InfoItem label="Poids" value={request.poids ? `${request.poids} kg` : "—"} />
              </>
            )}
            <InfoItem label="Montant" value={request.montant ? formatAmount(request.montant, request.devise) : "—"} />
            <InfoItem label="Créée le" value={formatDateTime(request.createdAt)} />
          </div>
          {request.type === "achat" && request.lien && (
            <div>
              <p className="text-xs font-semibold mb-0.5" style={{ color: C.inkSoft }}>
                Lien produit
              </p>
              <a href={request.lien} target="_blank" rel="noopener noreferrer" className="text-xs break-all" style={{ color: C.rust }}>
                {request.lien}
              </a>
            </div>
          )}

          <label className="block">
            <span className="text-xs font-semibold block mb-1" style={{ color: C.inkSoft }}>
              Statut
            </span>
            <select
              value={request.status}
              onChange={handleStatusChange}
              className="gc-body w-full px-3 py-2 rounded-lg border text-sm"
              style={{ borderColor: C.line, backgroundColor: C.paper }}
            >
              {stages.map((s) => (
                <option key={s.key} value={s.key}>
                  {s.label}
                </option>
              ))}
            </select>
            {savedFlash && (
              <p className="text-xs mt-1 flex items-center gap-1" style={{ color: C.signal }}>
                <Check size={12} /> Enregistré
              </p>
            )}
          </label>

          <label className="block">
            <span className="text-xs font-semibold block mb-1" style={{ color: C.inkSoft }}>
              Note interne
            </span>
            <textarea
              value={note}
              onChange={(e) => setNote(e.target.value)}
              onBlur={handleNoteBlur}
              rows={2}
              className="gc-body w-full px-3 py-2 rounded-lg border text-sm resize-none"
              style={{ borderColor: C.line, backgroundColor: C.paper }}
              placeholder="Visible seulement ici, pas pour le client."
            />
          </label>
        </div>
      )}
    </div>
  );
}

function ResetSection({ requests, onResetAll }) {
  const [confirming, setConfirming] = useState(false);

  if (requests.length === 0) return null;

  const handleReset = async () => {
    if (!confirming) {
      setConfirming(true);
      setTimeout(() => setConfirming(false), 4000);
      return;
    }
    await onResetAll();
    setConfirming(false);
  };

  return (
    <div className="mt-8 pt-5" style={{ borderTop: `1px solid ${C.line}` }}>
      <button onClick={handleReset} className="text-xs font-semibold" style={{ color: confirming ? C.danger : C.inkSoft }}>
        {confirming ? "Cliquer à nouveau pour tout supprimer" : "Supprimer toutes les demandes"}
      </button>
    </div>
  );
}

function AdminView({ requests, ready, onUpdate, onRefresh, onResetAll }) {
  const [authed, setAuthed] = useState(false);
  const [pwd, setPwd] = useState("");
  const [pwdError, setPwdError] = useState(false);
  const [expandedId, setExpandedId] = useState(null);
  const [filterType, setFilterType] = useState("toutes");
  const [filterStatus, setFilterStatus] = useState("toutes");

  const handleLogin = (e) => {
    e.preventDefault();
    if (pwd === ADMIN_PASSWORD) {
      setAuthed(true);
      setPwdError(false);
    } else {
      setPwdError(true);
    }
  };

  if (!authed) {
    return (
      <div>
        <p className="gc-mono text-xs mb-2" style={{ color: C.rust, letterSpacing: "0.05em" }}>
          GOACHAT · ESPACE ADMIN
        </p>
        <div className="flex items-center gap-2 mb-5">
          <Lock size={20} color={C.ink} />
          <h1 className="gc-display text-2xl" style={{ color: C.ink }}>
            Connexion
          </h1>
        </div>
        <form onSubmit={handleLogin} className="space-y-3">
          <input
            type="password"
            value={pwd}
            onChange={(e) => {
              setPwd(e.target.value);
              setPwdError(false);
            }}
            placeholder="Mot de passe"
            className="gc-body w-full px-3.5 py-2.5 rounded-lg border text-sm"
            style={{ borderColor: pwdError ? C.danger : C.line, backgroundColor: C.card }}
          />
          {pwdError && (
            <p className="text-sm" style={{ color: C.danger }}>
              Mot de passe incorrect.
            </p>
          )}
          <button
            type="submit"
            className="w-full gc-body font-semibold text-sm py-3 rounded-lg"
            style={{ backgroundColor: C.ink, color: C.paper }}
          >
            Entrer
          </button>
          <p className="text-xs pt-1" style={{ color: C.inkSoft }}>
            Accès protégé côté écran seulement — pense à restreindre l'accès à la base plus tard si besoin.
          </p>
        </form>
      </div>
    );
  }

  const newCount = requests.filter((r) => r.status === "nouvelle").length;
  const sorted = [...requests].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  const filtered = sorted
    .filter((r) => filterType === "toutes" || r.type === filterType)
    .filter((r) => filterStatus === "toutes" || r.status === filterStatus);

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <p className="gc-mono text-xs" style={{ color: C.rust, letterSpacing: "0.05em" }}>
          GOACHAT · ESPACE ADMIN
        </p>
        <button onClick={onRefresh} className="p-1.5 rounded-md" style={{ backgroundColor: C.paperAlt }} aria-label="Actualiser">
          <RefreshCw size={14} color={C.ink} />
        </button>
      </div>
      <h1 className="gc-display text-2xl mb-1" style={{ color: C.ink }}>
        Tableau de bord
      </h1>
      <p className="text-sm mb-5" style={{ color: C.inkSoft }}>
        {ready ? `${requests.length} demande${requests.length !== 1 ? "s" : ""} au total` : "Chargement..."}
        {newCount > 0 && (
          <span className="ml-2 px-2 py-0.5 rounded-full text-xs font-semibold" style={{ backgroundColor: C.amber, color: C.ink }}>
            {newCount} nouvelle{newCount !== 1 ? "s" : ""}
          </span>
        )}
      </p>

      <div className="flex gap-1.5 mb-2.5 overflow-x-auto pb-1">
        {["toutes", ...SERVICE_TYPES.map((t) => t.key)].map((k) => (
          <button
            key={k}
            onClick={() => setFilterType(k)}
            className="gc-body text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap flex-shrink-0"
            style={{
              backgroundColor: filterType === k ? C.ink : C.paperAlt,
              color: filterType === k ? C.paper : C.inkSoft,
            }}
          >
            {k === "toutes" ? "Tous les services" : SERVICE_TYPES.find((t) => t.key === k).short}
          </button>
        ))}
      </div>

      <div className="flex gap-1.5 mb-5 overflow-x-auto pb-1">
        {["toutes", ...FILTER_KEYS].map((k) => (
          <button
            key={k}
            onClick={() => setFilterStatus(k)}
            className="gc-body text-xs font-semibold px-3 py-1.5 rounded-full whitespace-nowrap flex-shrink-0"
            style={{
              backgroundColor: filterStatus === k ? C.ink : C.paperAlt,
              color: filterStatus === k ? C.paper : C.inkSoft,
            }}
          >
            {k === "toutes" ? "Tous les statuts" : STAGE_DEFS[k].label}
          </button>
        ))}
      </div>

      {ready && filtered.length === 0 && (
        <p className="text-sm py-8 text-center" style={{ color: C.inkSoft }}>
          Aucune demande pour l'instant.
        </p>
      )}

      <div className="space-y-2.5">
        {filtered.map((r) => (
          <AdminRequestRow
            key={r.id}
            request={r}
            expanded={expandedId === r.id}
            onToggle={() => setExpandedId(expandedId === r.id ? null : r.id)}
            onUpdate={onUpdate}
          />
        ))}
      </div>

      <ResetSection requests={requests} onResetAll={onResetAll} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GoachatApp />);
</script>
</body>
</html>
